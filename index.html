!1}],Rp=[{id:"req-101",senderId:"peer-diya",senderName:"Diya Sen",senderBranch:"Electronics & Communication (ECE)",receiverId:"user_aarav_sharma",receiverName:"Aarav Sharma",skillOffered:"Calculus & Linear Algebra",skillRequested:"C Programming",format:"hybrid",message:"Hey Aarav! Saw you know C pointers well. I can help you with Eigenvalues & Diagonalization for Math Assignment 3 if you can help me debug pointers!",status:"accepted",createdAt:new Date(Date.now()-864e5*2).toISOString(),sessionDetails:{date:new Date(Date.now()+864e5*1).toISOString().split("T")[0],time:"17:30 - 18:30",venueOrLink:"Central Library Study Room 3B / Google Meet",notes:"Bring Math Assignment 3 sheet and C pointer exercises."}},{id:"req-102",senderId:"user_aarav_sharma",senderName:"Aarav Sharma",senderBranch:"Computer Science & Engineering (CSE)",receiverId:"peer-rohan",receiverName:"Rohan Verma",skillOffered:"Basic Electronics",skillRequested:"Engineering Graphics & CAD",format:"in-person",message:"Hi Rohan! Could we spend 45 minutes on orthographic projections this Thursday? I can explain KCL/KVL diode circuits in return.",status:"pending",createdAt:new Date(Date.now()-864e5*.5).toISOString()},{id:"req-103",senderId:"peer-sanya",senderName:"Sanya Gupta",senderBranch:"Information Technology (IT)",receiverId:"user_aarav_sharma",receiverName:"Aarav Sharma",skillOffered:"Python for Engineers",skillRequested:"C Programming",format:"online",message:"Thanks for the session last Saturday! You really helped clarify memory models.",status:"completed",createdAt:new Date(Date.now()-864e5*5).toISOString(),sessionDetails:{date:new Date(Date.now()-864e5*3).toISOString().split("T")[0],time:"16:00 - 17:00",venueOrLink:"Google Meet",notes:"Reviewed pointer arithmetic and array decay."},rating:5,review:"Aarav explained pointer dereferencing with crystal-clear memory block diagrams!"}],Bp=[{id:"concept-eigenvalues",title:"Eigenvalues & Eigenvectors",category:"Engineering Mathematics",branch:"All Branches (Common)",difficulty:"Intermediate",summary:"A scalar lambda is an eigenvalue of matrix A if there exists a non-zero vector v such that A*v = lambda*v. Geometrically, the transformation A only stretches or compresses vector v without changing its spatial direction.",whyItMatters:"Fundamental to modal structural analysis, image compression (PCA), Google PageRank, quantum wave equations, and electronic circuit stability analysis.",realWorldApplication:"Civil engineers use eigenvalues to calculate the natural resonance frequencies of suspension bridges and skyscrapers to prevent catastrophic collapse under wind or earthquake tremors (e.g. Tacoma Narrows bridge phenomenon).",workedExample:{problem:"Find the eigenvalues of matrix A = [[4, 1], [2, 3]].",steps:["Write the characteristic equation: det(A - lambda*I) = 0.","Compute determinant: (4 - lambda)(3 - lambda) - (1)(2) = 0.","Expand quadratic equation: lambda^2 - 7*lambda + 12 - 2 = lambda^2 - 7*lambda + 10 = 0.","Factorize: (lambda - 5)(lambda - 2) = 0."],solution:"The eigenvalues are lambda_1 = 5 and lambda_2 = 2."},commonMistakes:["Forgetting that the zero vector (v = 0) can NEVER be an eigenvector, even though lambda = 0 can validly be an eigenvalue.","Sign error when expanding (a - lambda)(d - lambda) - bc = 0 in 2x2 determinants.","Assuming all nxn matrices have n distinct eigenvalues (repeated or complex roots are common)."],quiz:[{id:"q-eig-1",question:"If lambda is an eigenvalue of an invertible matrix A, what is the corresponding eigenvalue of A^(-1)?",options:["-lambda","1 / lambda","lambda^2","det(A) * lambda"],correctIndex:1,explanation:"Multiplying A*v = lambda*v by A^(-1) on both sides yields v = lambda * A^(-1)*v, hence A^(-1)*v = (1/lambda)*v."},{id:"q-eig-2",question:"The sum of all eigenvalues of any square matrix A is always strictly equal to what property of A?",options:["Determinant of A","Rank of A","Trace of A (sum of main diagonal elements)","Condition number of A"],correctIndex:2,explanation:"The trace of matrix A is algebraically identical to the coefficient of (-lambda^(n-1)) in the characteristic polynomial, which equals the sum of roots."}],relatedConceptIds:["concept-thevenin","concept-quantum-well"],mastered:!1,bookmarked:!0},{id:"concept-thevenin",title:"Thévenin's Theorem & Equivalent Circuits",category:"Basic Electrical & Electronics",branch:"ECE, EEE, CSE, ME",difficulty:"Beginner",summary:"Any linear electrical network with voltage sources, current sources, and resistors can be replaced at terminals A-B by an equivalent single voltage source V_th in series with a resistance R_th.",whyItMatters:"Allows engineers to analyze complex power grids and sensor circuits with varying load resistors without recalculating the entire network mesh equations each time.",realWorldApplication:"Smartphone battery charging power delivery: phone charging ICs model the wall charger output as a Thévenin equivalent to dynamically balance charging current without overheating the battery.",workedExample:{problem:"A 24V source is connected to a voltage divider with R1 = 12 Ohm and R2 = 6 Ohm. Find the Thévenin equivalent seen across R2.",steps:["V_th is the open-circuit voltage across R2: V_th = 24V * (6 / (12 + 6)) = 24 * (6/18) = 8V.","To find R_th, turn off independent sources (replace 24V ideal source with a short circuit).","Looking into terminals across R2, R1 and R2 are in parallel: R_th = (12 * 6) / (12 + 6) = 72 / 18 = 4 Ohm."],solution:"V_th = 8V in series with R_th = 4 Ohm."},commonMistakes:["Leaving dependent sources active or incorrectly opening voltage sources instead of shorting them.","Forgetting to remove the load resistor RL before computing the open circuit voltage V_oc."],quiz:[{id:"q-th-1",question:"When determining the Thévenin resistance R_th of an independent network, how should ideal voltage sources be deactivated?",options:["Replaced by an open circuit (infinite resistance)","Replaced by a short circuit (zero resistance)","Connected in reverse polarity","Grounded to chassis"],correctIndex:1,explanation:"An ideal voltage source maintains zero internal resistance; therefore, deactivating it (setting V=0) means replacing it with a 0 Ohm short circuit."},{id:"q-th-2",question:"Under what condition does a load resistor R_L extract MAXIMUM power from a Thévenin source (V_th, R_th)?",options:["R_L = 0 Ohm","R_L = Infinity","R_L = R_th","R_L = 2 * R_th"],correctIndex:2,explanation:"Maximum Power Transfer Theorem proves that power delivered to the load is maximized when R_L equals the internal Thévenin resistance R_th."}],relatedConceptIds:["concept-eigenvalues","concept-kirchhoff"],mastered:!0,bookmarked:!1},{id:"concept-kirchhoff",title:"Kirchhoff's Current & Voltage Laws (KCL & KVL)",category:"Basic Electrical & Electronics",branch:"All Branches",difficulty:"Beginner",summary:"KCL states that the algebraic sum of currents entering any circuit node is zero (conservation of electric charge). KVL states that the algebraic sum of potential differences around any closed loop is zero (conservation of energy).",whyItMatters:"The bedrock of all circuit analysis, from tiny microcontroller GPIO pins to multi-gigawatt national electrical transmission grids.",realWorldApplication:"Automotive wiring harnesses: car computers verify current return loops across sensors (ABS, airbag, throttle) using KCL node checks to detect broken wires or short-to-ground faults instantly.",workedExample:{problem:"At a junction node, three currents are entering: I1 = 3A, I2 = 4A, and one current is leaving: I3. What is the value of I3?",steps:["Apply KCL: Sum of entering currents = Sum of leaving currents.","I1 + I2 = I3.","3A + 4A = 7A."],solution:"I3 = 7A leaving the junction node."},commonMistakes:["Inconsistent sign conventions when writing loop equations (mixing clockwise and counter-clockwise traversals).","Confusing a junction node with a simple corner in a wire schematic."],quiz:[{id:"q-kcl-1",question:"Kirchhoff's Current Law (KCL) is a direct consequence of which fundamental law of physics?",options:["Conservation of Energy","Conservation of Electric Charge","Conservation of Linear Momentum","Newton's Third Law"],correctIndex:1,explanation:"Electric charge cannot accumulate indefinitely at a dimensionless junction node; hence charge conservation directly dictates KCL."}],relatedConceptIds:["concept-thevenin"],mastered:!0,bookmarked:!1},{id:"concept-quantum-well",title:"Quantum Mechanics: Particle in a 1D Infinite Box",category:"Engineering Physics",branch:"ECE, CSE, ME, Materials",difficulty:"Intermediate",summary:"A quantum particle confined inside a potential well of width L with infinitely high walls cannot possess arbitrary continuous energies. Boundary conditions force the wave function to form standing waves, resulting in quantized energy levels En = (n^2 * h^2) / (8 * m * L^2).",whyItMatters:"Explains why quantum confinement occurs, leading to modern semiconductor Quantum Dots in QLED displays, laser diodes, and resonant tunneling diodes.",realWorldApplication:"Quantum Dot Displays (QLEDs) and surgical laser scalpels: tuning the nanoparticle diameter L directly tunes the emitted optical color (energy gap) without changing the core chemical material!",workedExample:{problem:"Calculate the ratio of the second excited state energy (n=3) to the ground state energy (n=1) for a particle in a 1D box.",steps:["Energy formula is En = n^2 * E1.","Ground state corresponds to quantum number n = 1: E1 = 1^2 * E1 = E1.","Second excited state corresponds to n = 3: E3 = 3^2 * E1 = 9 * E1.","Ratio E3 / E1 = 9 / 1."],solution:"The energy ratio is 9:1."},commonMistakes:['Confusing the "first excited state" (n=2) with the "ground state" (n=1). Second excited state is n=3.',"Assuming the particle can sit completely at rest (n=0); n=0 would mean psi(x)=0 everywhere, violating probability normalization."],quiz:[{id:"q-qm-1",question:"Why is the zero-point energy (n = 0) physically impossible for a particle confined in an infinite 1D potential well?",options:["It would violate the Heisenberg Uncertainty Principle (both position and momentum would have zero uncertainty)","It violates thermodynamics second law","The wave function becomes infinite","Particles always have negative energy"],correctIndex:0,explanation:"If energy were zero, momentum p=0 with zero uncertainty. But position is bounded within [0, L], which would violate delta_x * delta_p >= hbar / 2."}],relatedConceptIds:["concept-laser-optics"],mastered:!1,bookmarked:!0},{id:"concept-laser-optics",title:"Laser Action & Stimulated Emission",category:"Engineering Physics",branch:"ECE, EEE, Mechanical",difficulty:"Beginner",summary:"LASER (Light Amplification by Stimulated Emission of Radiation) requires three fundamental conditions: Population Inversion (more atoms in higher energy state), Pumping mechanism, and an Optical Resonant Cavity to feed photons back.",whyItMatters:"Essential for fiber-optic internet backbones, LiDAR in autonomous vehicles, laser cutting in precision manufacturing, and barcode scanners.",realWorldApplication:"Fiber Optic High-Speed Internet: semiconductor DFB lasers modulate photons at 100+ Gigabits per second through undersea transoceanic silica glass fibers with near-zero dispersion.",workedExample:{problem:"A helium-neon laser emits red light at wavelength lambda = 632.8 nm. What is the energy difference between the two transition energy levels?",steps:["Use Planck equation: Delta E = h * c / lambda.","h = 6.626 * 10^(-34) J*s, c = 3.0 * 10^8 m/s, lambda = 632.8 * 10^(-9) m.","Delta E = (6.626 * 10^(-34) * 3 * 10^8) / (632.8 * 10^(-9)) = 3.14 * 10^(-19) Joules.","Convert to electron-volts (1 eV = 1.6 * 10^(-19) J): 3.14 / 1.6 = 1.96 eV."],solution:"The laser transition energy difference is 1.96 eV."},commonMistakes:["Confusing spontaneous emission (random phase, incoherent) with stimulated emission (identical wavelength, direction, and phase).","Thinking a 2-level laser system can maintain steady-state population inversion (a minimum 3-level or 4-level system is required)."],quiz:[{id:"q-las-1",question:"Which characteristic uniquely distinguishes stimulated emission from spontaneous emission of light?",options:["The emitted photon has a completely random phase","The emitted photon has identical phase, frequency, direction, and polarization as the incident trigger photon","It produces multi-colored incoherent light","It requires no external energy input"],correctIndex:1,explanation:"Stimulated emission copies the incident photon exactly in phase, frequency, direction, and polarization, giving laser light its signature coherence."}],relatedConceptIds:["concept-quantum-well"],mastered:!1,bookmarked:!1},{id:"concept-pointers-c",title:"Pointers & Dynamic Memory Allocation in C",category:"Programming Fundamentals",branch:"CSE, IT, ECE",difficulty:"Intermediate",summary:"A pointer is a variable that stores the physical hexadecimal memory address of another variable. Dynamic allocation (malloc, calloc, realloc, free) allows allocation of heap memory at runtime rather than fixed stack compile-time sizes.",whyItMatters:"Crucial for high-performance systems engineering, operating system kernels, device drivers, embedded microcontrollers, and building dynamic data structures like trees and graphs.",realWorldApplication:"Linux Operating System kernel memory management: the kernel dynamically assigns page buffers and DMA memory blocks to network and GPU cards using raw C pointers for zero-copy performance.",workedExample:{problem:'What is printed by: int a = 10; int *p = &a; *p = 25; printf("%d", a); ?',steps:["Variable a is allocated in stack memory and initialized with value 10.","Pointer variable p stores the memory address of a (&a).","*p dereferences the pointer, directly mutating the value residing at address &a to 25.","printf prints the value of a."],solution:"Prints: 25."},commonMistakes:["Dangling pointers: using memory after calling free(p) without setting p = NULL.","Memory leaks: allocating heap memory with malloc() inside a loop without calling free().",'Off-by-one buffer overflows when allocating strings: forgetting +1 byte for the null terminator "\\0".'],quiz:[{id:"q-ptr-1",question:"What is the primary difference between malloc() and calloc() in standard C library <stdlib.h>?",options:["malloc() allocates on stack while calloc() allocates on heap","calloc() initializes all allocated bytes to zero; malloc() leaves memory uninitialized (garbage values)","malloc() cannot be freed with free()","calloc() is only used for character arrays"],correctIndex:1,explanation:"calloc(n, size) initializes every byte to 0, whereas malloc(size) leaves existing garbage memory as-is for maximum allocation speed."},{id:"q-ptr-2",question:"If int arr[5] = {10, 20, 30, 40, 50}; what does *(arr + 2) evaluate to?",options:["10","20","30","Memory address of arr[2]"],correctIndex:2,explanation:"arr decays to a pointer to arr[0]. (arr + 2) points to the 3rd element arr[2], and dereferencing gives 30."}],relatedConceptIds:["concept-recursion-stack","concept-big-o"],mastered:!1,bookmarked:!0},{id:"concept-recursion-stack",title:"Recursion & The Call Stack",category:"Programming Fundamentals",branch:"CSE, IT, ECE",difficulty:"Beginner",summary:"A recursive function solves a problem by calling copies of itself with smaller sub-inputs. Every function invocation creates a stack frame containing local variables and return addresses on the runtime call stack until reaching the base case.",whyItMatters:"Enables elegant divide-and-conquer algorithms (MergeSort, QuickSort), tree and graph traversals (DOM tree, file systems), and compiler expression parsers.",realWorldApplication:"JSON and XML parsers in web browsers: recursive descent parsers process nested JSON objects within objects by recursively descending into nested braces.",workedExample:{problem:"Trace the stack for recursive factorial function fact(3).",steps:["fact(3) called: pushes stack frame [n=3], calls fact(2).","fact(2) called: pushes stack frame [n=2], calls fact(1).","fact(1) reaches base case: returns 1.","fact(2) receives 1: computes 2 * 1 = 2, pops frame.","fact(3) receives 2: computes 3 * 2 = 6, pops frame."],solution:"Returns 6."},commonMistakes:["Missing or faulty base case: causes infinite recursion and terminates the process with a Stack Overflow exception.","Unnecessary exponential recursion: e.g. naive Fibonacci fib(n) = fib(n-1) + fib(n-2) has O(2^n) time complexity instead of using memoization."],quiz:[{id:"q-rec-1",question:"What runtime error occurs if a recursive function fails to reach its terminating base condition?",options:["Null Pointer Exception","Stack Overflow Error","Segmentation Fault due to disk full","Memory Allocation Warning"],correctIndex:1,explanation:"Every recursive call pushes a stack frame. Without a base case, call stack memory is exhausted, triggering a Stack Overflow."}],relatedConceptIds:["concept-pointers-c","concept-big-o"],mastered:!0,bookmarked:!1},{id:"concept-big-o",title:"Big-O Notation & Time Complexity",category:"Programming Fundamentals",branch:"CSE, IT, All Branches",difficulty:"Beginner",summary:"Big-O notation describes the asymptotic upper bound on the time or memory space required by an algorithm as the input size n grows toward infinity. It abstracts hardware speeds to measure intrinsic algorithmic efficiency.",whyItMatters:"Determines whether an application can scale to millions of users or freezes under real production loads.",realWorldApplication:"Database indexing: finding a user among 1 billion accounts with O(log n) B-Tree index takes ~30 disk reads versus O(n) sequential scan taking 1 billion reads (hours vs milliseconds!).",workedExample:{problem:"Determine the time complexity of two nested loops: for (i=0; i<n; i++) for (j=0; j<n; j++) sum++;",steps:["Outer loop runs n times: i from 0 to n-1.","For each outer iteration, inner loop runs n times: j from 0 to n-1.","Total operations = n * n = n^2."],solution:"Time complexity is O(n^2) quadratic time."},commonMistakes:["Premature optimization: worrying about microsecond constant factors instead of asymptotic order of growth.","Assuming two sequential loops O(n) + O(n) is O(n^2) (it is O(2n) = O(n))."],quiz:[{id:"q-bo-1",question:"Which time complexity class represents the FASTEST asymptotic growth among the following?",options:["O(n^2)","O(n log n)","O(log n)","O(2^n)"],correctIndex:2,explanation:"O(log n) logarithmic time grows the slowest of the options, making it the most efficient as n scales."}],relatedConceptIds:["concept-pointers-c"],mastered:!1,bookmarked:!1},{id:"concept-edta-hardness",title:"Water Hardness & EDTA Complexometric Titration",category:"Engineering Chemistry",branch:"Mechanical, Civil, Chemical, All",difficulty:"Beginner",summary:"Hardness in water is caused by multivalent metal cations, primarily Calcium (Ca2+) and Magnesium (Mg2+). EDTA (Ethylene Diamine Tetraacetic Acid) acts as a hexadentate chelating agent that binds 1:1 with metal ions at pH 10 buffer with Eriochrome Black T (EBT) indicator.",whyItMatters:"Industrial thermal boilers and heat exchangers develop scale deposits if fed hard water, leading to explosive boiler tube ruptures and massive heat transfer efficiency drops.",realWorldApplication:"Thermal Power Plant water treatment: water is continuously softened and monitored using automated EDTA titration sensors to protect multi-million dollar supercritical steam turbines.",workedExample:{problem:"50 mL of hard water sample requires 15 mL of 0.01 M EDTA solution for complete titration. Calculate the total hardness in ppm of CaCO3 equivalent.",steps:["1 mL of 0.01 M EDTA = 1 mg of CaCO3 equivalent.","15 mL of 0.01 M EDTA = 15 mg of CaCO3 equivalent.","In 50 mL of water, CaCO3 equivalent = 15 mg.","In 1000 mL (1 Liter) of water = 15 * (1000 / 50) = 300 mg/L."],solution:"Total Hardness = 300 ppm (or mg/L) CaCO3 equivalent."},commonMistakes:["Forgetting that the wine-red color is the [M-EBT] complex, while the sharp sky-blue endpoint is the free indicator [EBT] after EDTA steals the metal ion.","Omitting the NH4OH-NH4Cl buffer: EDTA titration must be performed strictly at pH 9-10; otherwise EBT indicator will not function."],quiz:[{id:"q-edta-1",question:"What is the color change observed at the equivalence endpoint of EDTA titration using Eriochrome Black-T (EBT) indicator at pH 10?",options:["Colorless to Pink","Wine Red to Steel Blue","Blue to Red","Yellow to Orange"],correctIndex:1,explanation:"The unstable wine-red [Ca/Mg-EBT] complex releases free EBT indicator as EDTA forms a stable colorless complex, turning the solution distinct steel blue."}],relatedConceptIds:["concept-corrosion"],mastered:!0,bookmarked:!1},{id:"concept-corrosion",title:"Electrochemical Corrosion & Galvanic Protection",category:"Engineering Chemistry",branch:"Mechanical, Civil, Electrical",difficulty:"Intermediate",summary:"Corrosion is the unintentional deterioration of metal via electrochemical reaction with its environment. Galvanic corrosion occurs when two metals with different electrode potentials make electrical contact in an electrolyte.",whyItMatters:"Corrosion causes catastrophic structural failures in bridges, underground oil pipelines, marine shipping hulls, and aerospace components, costing over 3% of global GDP annually.",realWorldApplication:"Sacrificial Zinc Anodes on Ship Hulls: naval engineers bolt blocks of zinc to steel ship hulls. Because zinc has a more negative standard reduction potential, zinc preferentially oxidizes (sacrifices itself), completely protecting the steel hull from seawater corrosion.",workedExample:{problem:"Between Iron (E0 Fe2+/Fe = -0.44 V) and Zinc (E0 Zn2+/Zn = -0.76 V), which metal will act as anode in a galvanic couple?",steps:["Compare standard reduction potentials: E0(Zn) = -0.76 V < E0(Fe) = -0.44 V.","The metal with more negative reduction potential oxidizes more readily.","Oxidation always occurs at the anode."],solution:"Zinc has the lower potential and acts as the sacrificial anode, oxidizing to Zn2+."},commonMistakes:["Confusing the cathode (reduction/protected) with anode (oxidation/corrodes).","Thinking stainless steel is completely immune to corrosion in high-salinity seawater without aeration."],quiz:[{id:"q-cor-1",question:"In cathodic protection via sacrificial anode method, the metal that is intended to be protected must act as the:",options:["Anode","Cathode","Electrolyte","Salt bridge"],correctIndex:1,explanation:"Electrons flow from the sacrificial anode to the protected structure, forcing the protected metal to act as the non-corroding cathode."}],relatedConceptIds:["concept-edta-hardness"],mastered:!1,bookmarked:!1},{id:"concept-free-body",title:"Free Body Diagrams & Equilibrium in Engineering Mechanics",category:"Engineering Problem-Solving",branch:"Mechanical, Civil, Aerospace",difficulty:"Beginner",summary:"A Free Body Diagram (FBD) is a visual sketch representing an isolated body separated from its surroundings, with all external forces, moments, and reaction constraints explicitly drawn with correct vectors.",whyItMatters:"Every mechanical stress analysis, truss calculation, automotive suspension simulation, and robotic actuator sizing begins with a properly drawn FBD.",realWorldApplication:"Robotic Arm Joint Actuators: roboticists draw 3D FBDs of each arm link under payload acceleration to calculate required motor torques (tau = I*alpha + r x F) to prevent gear stripping.",workedExample:{problem:"A 50 kg mass hangs from two symmetric ropes angled at 45 degrees to the horizontal ceiling. Find tension T in each rope.",steps:["Downward gravitational force W = m * g = 50 * 9.81 = 490.5 N.","Vertical equilibrium sum: 2 * T * sin(45 deg) - W = 0.","T * 2 * (sqrt(2)/2) = 490.5 => T * sqrt(2) = 490.5.","T = 490.5 / 1.414 = 346.9 N."],solution:"Tension in each rope is 346.9 N."},commonMistakes:["Drawing internal forces (e.g. molecular tension inside a rigid bar) on an FBD instead of only external forces.","Drawing normal reaction force perpendicular to the ground rather than perpendicular to the actual inclined contact surface."],quiz:[{id:"q-fbd-1",question:"When drawing a Free Body Diagram of an object sliding down a 30-degree friction ramp, what direction does the normal reaction force N act?",options:["Directly vertically upward opposing gravity","Perpendicular to the inclined ramp surface, pointing outward away from the ramp","Parallel to the ramp in the direction of motion","Horizontally toward the left"],correctIndex:1,explanation:"Normal contact force is strictly perpendicular (normal) to the contact plane between surfaces."}],relatedConceptIds:["concept-dimensional-analysis"],mastered:!1,bookmarked:!1},{id:"concept-dimensional-analysis",title:"Dimensional Analysis & Buckingham Pi Theorem",category:"Engineering Problem-Solving",branch:"All Engineering Disciplines",difficulty:"Intermediate",summary:"Dimensional analysis verifies physical formula consistency using fundamental dimensions [M, L, T, I]. Buckingham Pi Theorem proves that a physical relationship among n variables involving m fundamental dimensions can be reduced to (n - m) dimensionless Pi terms.",whyItMatters:"Enables wind tunnel aircraft testing and hydraulic dam scale models: engineers scale miniature physical models to accurately predict full-scale aircraft behavior using dimensionless numbers (Reynolds, Froude, Mach).",realWorldApplication:"Formula 1 Aerodynamic Wind Tunnels: F1 teams test 60% scale models in wind tunnels by matching the Reynolds number Re = (rho * v * L) / mu to mimic track conditions precisely.",workedExample:{problem:"Verify if the period of a simple pendulum T = 2 * pi * sqrt(L / g) is dimensionally homogeneous.",steps:["Dimension of Left Side [T] = [T^1].","2 * pi is dimensionless [M^0 L^0 T^0].","Length L has dimension [L]. Acceleration due to gravity g has dimension [L * T^(-2)].","[L / g] = [L / (L * T^(-2))] = [T^2].","sqrt([T^2]) = [T^1]."],solution:"Left side [T] = Right side [T]. The formula is dimensionally homogeneous."},commonMistakes:["Assuming that dimensional consistency guarantees the physical formula is completely correct (it cannot verify dimensionless constant multipliers like 1/2 or 2*pi).","Confusing units (e.g. kilograms, pounds) with fundamental dimensions ([M], [L], [T])."],quiz:[{id:"q-da-1",question:"If a fluid flow phenomenon involves 6 physical variables and 3 fundamental dimensions (Mass, Length, Time), how many independent dimensionless groups (Pi terms) will result according to Buckingham Pi Theorem?",options:["6","3","2","18"],correctIndex:1,explanation:"Buckingham Pi Theorem states that number of Pi groups = n - m = 6 - 3 = 3."}],relatedConceptIds:["concept-free-body"],mastered:!0,bookmarked:!1}],zp=[{id:"tt-1",day:"Monday",startTime:"09:00",endTime:"10:00",subject:"Engineering Mathematics-I",room:"LHC-204",faculty:"Dr. V. Sharma",color:"#6366f1",type:"lecture"},{id:"tt-2",day:"Monday",startTime:"10:15",endTime:"11:15",subject:"Engineering Physics",room:"LHC-204",faculty:"Dr. R. Nair",color:"#8b5cf6",type:"lecture"},{id:"tt-3",day:"Monday",startTime:"11:30",endTime:"13:00",subject:"Problem Solving & C Programming",room:"CS-Lab 3",faculty:"Prof. P. Sengupta",color:"#3b82f6",type:"lab"},{id:"tt-4",day:"Tuesday",startTime:"09:00",endTime:"10:00",subject:"Basic Electrical & Electronics",room:"LHC-102",faculty:"Dr. K. Patel",color:"#ec4899",type:"lecture"},{id:"tt-5",day:"Tuesday",startTime:"10:15",endTime:"12:15",subject:"BEEE Hardware Laboratory",room:"EE-Lab 1",faculty:"Dr. K. Patel & TAs",color:"#ec4899",type:"lab"},{id:"tt-6",day:"Wednesday",startTime:"09:00",endTime:"10:00",subject:"Engineering Chemistry",room:"LHC-301",faculty:"Dr. A. Roy",color:"#10b981",type:"lecture"},{id:"tt-7",day:"Wednesday",startTime:"10:15",endTime:"11:15",subject:"Engineering Mathematics-I",room:"LHC-204",faculty:"Dr. V. Sharma",color:"#6366f1",type:"lecture int main() {
    int arr[] = {10, 20, 30, 40, 50};
    int *ptr = arr;
    
    ptr += 3;
    printf("%d", *ptr - *(arr + 1));
    return 0;
}`,challengeType:"predict_output",options:["10","20","30","40"],correctAnswer:"20",hints:["ptr initially points to arr[0] (value 10).","ptr += 3 advances the pointer by 3 integers. What element is ptr now pointing to?","*(arr + 1) dereferences the element at index 1."],explanation:"ptr initially points to arr[0] (10). Doing ptr += 3 points to arr[3], which is 40. *(arr + 1) evaluates to arr[1], which is 20. Hence *ptr - *(arr + 1) = 40 - 20 = 20.",testCases:[{input:"No standard input",expectedOutput:"20"}],xpReward:50,completed:!0},{id:"code-c-2",title:"Postfix vs Prefix Increment Mystery in C",language:"c",track:"Operators & Precedence",difficulty:"Easy",learningObjective:"Master the sequence of side-effects between pre-increment and post-increment.",question:"Determine what will be printed by the following code snippet:",codeSnippet:`#include <stdio.h>

    return 0;
}`,challengeType:"mcq",options:["x=7, y=12","x=7, y=11","x=6, y=12","Undefined behavior / Compiler warning in C standards"],correctAnswer:3,hints:["Can a variable be modified more than once between sequence points in C99/C11?","Look up ISO C standard section 6.5 paragraph 2 regarding sequence points."],explanation:"Modifying x more than once without an intervening sequence point triggers Undefined Behavior (UB) according to ANSI/ISO C standards. In actual engineering code, never write expressions modifying the same variable twice in one expression!",xpReward:45,completed:!1},{id:"code-c-3",title:"String Length Without Null Terminator Bug",language:"c",track:"Strings & Memory Allocation",difficulty:"Medium",learningObjective:"Identify memory corruption caused by missing null character in C strings.",question:"Identify the bug in this dynamic string copy function:",codeSnippet:`char* duplicate_str(const char *src) {
    int len = strlen(src);
    char *dest = (char*)malloc(len); // Line A
    strcpy(dest, src);               // Line B
    return dest;
}`,challengeType:"debug_code",options:["malloc must be cast to (char**)",'Line A must allocate (len + 1) bytes to store the null terminator "\\0"',"strcpy does not support heap memory","strlen does not count letters correctly"],correctAnswer:1,hints:['Does strlen("hello") return 5 or 6?',"How does strcpy know where the string ends in destination buffer?"],explanation:"strlen() computes the number of characters excluding the terminating null byte '\\0'. strcpy() writes (len + 1) bytes. Allocating only len bytes causes a 1-byte heap buffer overflow (off-by-one bug), corrupting adjacent heap metadata.",xpReward:60,completed:!1},{id:"code-py-1",title:"Python Mutable Default Argument Trap",language:"python",track:"Python Functions & Scope",difficulty:"Easy",learningObjective:"Learn why default arguments in Python are evaluated once at function definition time.",question:"What is the final printed output of this Python code?",codeSnippet:`def append_item(val, items=[]):
    items.append(val)
    return items

list1 = append_item(10)
list2 = append_item(20)
print(list1, list2)`,challengeType:"predict_output",options:["[10] [20]","[10, 20] [10, 20]","[10] [10, 20]","TypeError: items is immutable"],correctAnswer:"[10, 20] [10, 20]",hints:["When is the default parameter items=[] initialized by Python interpreter?","Do list1 and list2 reference two distinct lists, or the same underlying list in memory?"],explanation:"In Python, default arguments are evaluated ONCE when the function definition is executed, not each time the function is called. Because the empty list is mutable, both calls modify and return references to the exact same list in memory: [10, 20]. The idiomatic fix is `def append_item(val, items=None): if items is None: items = []`.",testCases:[{input:"No stdin",expectedOutput:"[10, 20] [10, 20]"}],xpReward:50,completed:!0},{id:"code-py-2",title:"Python List Slicing & Step Reversal",language:"python",track:"Python Data Structures",difficulty:"Easy",learningObjective:"Master slicing syntax [start:stop:step] in Python.",question:"What does the slice nums[5:1:-2] return for nums = [0, 10, 20, 30, 40, 50, 60]?",codeSnippet:`nums = [0, 10, 20, 30, 40, 50, 60]
result = nums[5:1:-2]
print(result)`,challengeType:"predict_output",options:["[50, 30]","[60, 40, 20]","[50, 40, 30, 20]","[30, 50]"],correctAnswer:"[50, 30]",hints:["Index 5 is nums[5] = 50.","The step is -2 (moving backwards by 2).","The stop bound 1 (nums[1]=10) is exclusive."],explanation:"nums[5] is 50. Stepping backwards by 2 reaches index 3 (nums[3] = 30). The next step would reach index 1, but stop index 1 is exclusive. Thus the result is [50, 30].",testCases:[{input:"None",expectedOutput:"[50, 30]"}],xpReward:40,completed:!1},{id:"code-py-3",title:"Scope LEGB Rule in Nested Functions",language:"python",track:"Python Scope",difficulty:"Medium",learningObjective:"Understand Local, Enclosing, Global, Built-in (LEGB) scoping and the nonlocal keyword.",question:"What is output by running the following script?",codeSnippet:`counter = 5

def outer():
    counter = 10

        counter += 2

outer()
print(counter)`,challengeType:"predict_output",options:["12 10 5","12 12 5","12 12 7","UnboundLocalError"],correctAnswer:"12 12 5",hints:["nonlocal binds to the enclosing outer() scope variable, not the global one.","What happens to outer's counter when inner() executes counter += 2?","Does the global counter at module level change?"],explanation:"The `nonlocal counter` declaration inside inner() targets the `counter` in outer's scope. It mutates it from 10 to 12. So inner() prints 12. Next, outer() prints its now-mutated counter (12). The global counter remains untouched at 5. Output: 12 12 5.",testCases:[{input:"None",expectedOutput:"12 12 5"}],xpReward:55,completed:!1},{id:"code-c-4",title:"Bitwise Bitmasking for Hardware Registers",language:"c",track:"Embedded & Bitwise Operations",difficulty:"Medium",learningObjective:"Set and clear individual register bits using bitwise OR and AND operators.",question:"Which C statement correctly CLEARS (sets to 0) the 4th bit (0-indexed bit 3) of register REG without affecting any other bits?",codeSnippet:`// Suppose REG is an 8-bit hardware control register:
// We want to clear bit 3 (mask 0b00001000 = (1 << 3))
REG = ?;`,challengeType:"mcq",options:["REG = REG | (1 << 3);","REG = REG ^ (1 << 3);","REG = REG & ~(1 << 3);","REG = ~(REG & (1 << 3));"],correctAnswer:2,hints:["(1 << 3) has a 1 only at bit position 3.","Bitwise NOT ~(1 << 3) produces 11110111 in binary.","Bitwise AND with 1 preserves existing bits; AND with 0 forces bit to 0."],explanation:"~(1 << 3) creates a bitmask where every bit is 1 except bit 3 which is 0. Doing REG & ~(1 << 3) clears bit 3 while preserving the state of all other bits.",xpReward:65,completed:!1},{id:"code-py-4",title:"Dictionary Comprehension & Inversion",language:"python",track:"Python Fundamentals",difficulty:"Easy",learningObjective:"Use dictionary comprehensions to invert key-value pairs.",question:"What is the output of this dictionary comprehension?",codeSnippet:`original = {'a': 1, 'b': 2, 'c': 3}
